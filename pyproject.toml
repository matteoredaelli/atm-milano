[project]
name = "atm-milano-workspace"
version = "0.0.0"
description = "Workspace root (not published)"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
atm-milano = { workspace = true }
atm-milano-mcp = { workspace = true }

[dependency-groups]
dev = [
    "atm-milano",
    "atm-milano-mcp",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "-m 'not live'"
markers = ["live: hits the real ATM/Comune di Milano services (network)"]
