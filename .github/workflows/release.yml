name: Release
# Tag vX.Y.Z publishes both packages with that version (derived from the tag via hatch-vcs).
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history for hatch-vcs
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: make sync && make check
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/, retention-days: 1 }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }
