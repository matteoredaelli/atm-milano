name: Release
# Tag vX.Y.Z publishes both packages with that version (derived from the tag via hatch-vcs).
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }   # full history for hatch-vcs
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: make sync && make check
      - run: make build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/, retention-days: 1 }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      # One publish step per package: each step mints its own OIDC token, which is required
      # when several projects are created from pending publishers in the same run.
      - name: Split dist per package
        run: |
          mkdir dist-lib dist-mcp
          mv dist/atm_milano_mcp-* dist-mcp/
          mv dist/atm_milano-* dist-lib/
      - name: Publish atm-milano
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist-lib, skip-existing: true }
      - name: Publish atm-milano-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist-mcp, skip-existing: true }

  mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    # Skip pre-releases (alpha/beta/rc tags)
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login to the MCP Registry (no secrets needed)
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v6

      - name: Set version in server.json from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Wait until PyPI serves the new version with the mcp-name marker
        run: |
          PKG=$(jq -r '.packages[0].identifier' server.json)
          VER=$(jq -r '.version' server.json)
          NAME=$(jq -r '.name' server.json)
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/$PKG/$VER/json" | grep -q "mcp-name: $NAME"; then exit 0; fi
            echo "waiting for PyPI ($i/30)..."; sleep 10
          done
          echo "PyPI did not expose $PKG $VER with marker"; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
